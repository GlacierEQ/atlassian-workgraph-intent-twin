[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="atlassian-workgraph-intent-twin"
version="1.0.0"
description="Multi-object workgraph intent drift and acceptance verifier"
requires-python=">=3.11"
dependencies=[]

[project.scripts]
workgraph-intent-twin="workgraph_intent_cli:main"

[tool.setuptools]
py-modules=["workgraph_intent_twin","workgraph_intent_cli","promotion_authority"]
package-dir={""="src"}

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
